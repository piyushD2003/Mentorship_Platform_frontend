<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentorship Platform</title>
  <link rel="stylesheet" href="Dashboard.css">
</head>

<body>
  <!-- Navigation Bar -->
  <!-- <iframe src="navbar.html" scrolling="no" style="border: none; width: 100%; height: auto; z-index: 3;"></iframe> -->
  <nav>
    <div id="navbar-container"></div>
  </nav>
  <!-- Hero Section -->
  <main>
    <section class="dashboard-section">
      <div class="section-container">
        <h2>User Dashboard</h2>
        <form class="dashboard-form">
          <label for="role">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your name">

          <label for="role">Email</label>
          <input type="text" id="email" name="email" placeholder="Enter your email" >

          <label for="role">Role</label>
          <input type="text" id="role" name="role" placeholder="Enter your role">

          <label for="skills">Skills (comma separated)</label>
          <input type="text" id="skills" name="skills" placeholder="E.g., HTML, CSS, JavaScript">

          <label for="interests">Interests (comma separated)</label>
          <input type="text" id="interests" name="interests" placeholder="E.g., AI, Web Development">

          <label for="organisation">Organisation</label>
          <input type="text" id="organisation" name="organisation" placeholder="Enter your organisation">

          <label for="position">Position</label>
          <input type="text" id="position" name="position" placeholder="Enter your position">

          <label for="year_experience">Years of Experience</label>
          <input type="number" id="year_experience" name="year_experience" min="0"
            placeholder="Enter years of experience">

          <label for="experience">Experience (JSON format)</label>
          <textarea id="experience" name="experience"
            placeholder='E.g. "CodeCraft Labs": "Frontend Developer", "Global Solutions": "Junior Developer"'
          ></textarea>

          <label for="education">Education</label>
          <textarea id="education" name="education" placeholder="Enter your education details"></textarea>

          <label for="social_links">Social Links (JSON format)</label>
          <textarea id="social_links" name="social_links" placeholder='E.g., "LinkedIn": "url", "GitHub": "url"'
          ></textarea>

          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" placeholder="Write a brief bio about yourself"></textarea>

          <label for="image">Profile Image</label>
          <input type="file" id="image" name="image" accept="image/*">

          <button type="submit" class="btn" >Update Details</button>
        </form>
      </div>
    </section>
  </main>
  <!-- Footer -->
  <footer>
    <div id="footer-container"></div>
  </footer>
  <script src="script.js"></script>
  <script>
    (async () => {
      const authToken = localStorage.getItem('authToken');

      if (!authToken) {
        console.error('No auth token found in localStorage');
        // Redirect to login page or show an error message
        // window.location.href = 'Login.html'; // Example: Redirect to login page
        return;
      }
      console.log(authToken);
      const base64Url = authToken.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const payload = JSON.parse(atob(base64));
      console.log(payload);

      try {
        const response = await fetch(`https://mentorship-platfrom-backend.vercel.app/api/users/${payload.user.id}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
        });
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        console.log(data);
        
        console.log('User data:', data.username);

        document.getElementById('username').value = data.username || '';
        document.getElementById('email').value = data.email || '';
        document.getElementById('role').value = data.role || '';
        document.getElementById('skills').value = (data.skills || []).join(', ');
        document.getElementById('interests').value = (data.interests || []).join(', ');
        document.getElementById('organisation').value = data.organisation || '';
        document.getElementById('position').value = data.position || '';
        document.getElementById('year_experience').value = data.year_experience || 0;
        document.getElementById('experience').value = JSON.stringify(data.experience, null, 2) || '';
        document.getElementById('education').value = data.education || '';
        document.getElementById('social_links').value = JSON.stringify(data.social_links, null, 2) || '';
        document.getElementById('bio').value = data.bio || '';

      } catch (error) {
        console.error('Error fetching user data:', error);
        // Optionally, redirect to the login page or show an error message
        window.alert('Failed to fetch user data. Please log in again.');
        // window.location.href = 'Login.html';
      }
    })();
  </script>

  <script>
    document.querySelector('.dashboard-form').addEventListener('submit', updateProfile);

    async function updateProfile(event) {
  event.preventDefault(); // Prevent form from reloading the page
  const authToken = localStorage.getItem('authToken');

  if (!authToken) {
        console.error('No auth token found in localStorage');
        // Redirect to login page or show an error message
        // window.location.href = 'Login.html'; // Example: Redirect to login page
        return;
      }
      console.log(authToken);
      const base64Url = authToken.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const payload = JSON.parse(atob(base64));
      console.log(payload);
  // Collect form data
  const formData = {
    // username: document.getElementById('username').value,
    // email: document.getElementById('email').value,
    role: document.getElementById('role').value||"",
    skills: document.getElementById('skills').value.split(',').map(skill => skill.trim())||"",
    interests: document.getElementById('interests').value.split(',').map(interest => interest.trim())||"",
    Organisation: document.getElementById('organisation').value||"",
    position: document.getElementById('position').value||'',
    year_experience: parseInt(document.getElementById('year_experience').value) || 0,
    experience: JSON.parse(document.getElementById('experience').value || '{}'),
    education: document.getElementById('education').value||"",
    social_links: JSON.parse(document.getElementById('social_links').value || '{}'),
    bio: document.getElementById('bio').value ||"",
  };
  console.log(formData.bio);
  
  try {
    const response = await fetch(`https://mentorship-platfrom-backend.vercel.app/api/Updateprofile/${payload.user.id}`, {
      method: 'POST', // Use PUT for updates
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    });

    if (!response.ok) {
      throw new Error(`Error updating profile: ${response.status}`);
    }

    const result = await response.json();
    alert('Profile updated successfully!');
    console.log('Updated profile data:', result);

  } catch (error) {
    console.error('Error updating profile:', error);
    alert('Failed to update profile. Please try again.');
  }
}

function parseJSON(value) {
  try {
    return JSON.parse(value || '{}');
  } catch {
    return {};
  }
}
  </script>
</body>

</html>
