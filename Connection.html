<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentorship Platform</title>
  <link rel="stylesheet" href="Connection.css">
</head>

<body>
  <!-- Navigation Bar -->
  <!-- <iframe src="navbar.html" scrolling="no" style="border: none; width: 100%; height: auto; z-index: 3;"></iframe> -->
  <nav>
    <div id="navbar-container"></div>
  </nav>
  <!-- Hero Section -->
  <main class="main-content">
    <h2 class="page-title">Your Connections</h2>
    <div id="connectionsList" class="card-container">
      <!-- Cards will be inserted dynamically -->
    </div>
  </main>
  <!-- Footer -->
  <footer>
    <div id="footer-container"></div>
  </footer>
  <script src="script.js"></script>
  <script>

    const authToken = localStorage.getItem('authToken');
    const base64Url = authToken.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const payload = JSON.parse(atob(base64));
    const user_id = payload.user.id
    console.log(user_id);
    document.addEventListener("DOMContentLoaded", async () => {
      const connectionsList = document.getElementById("connectionsList");
      try {

        // Fetch connected users
        const response = await fetch(`https://mentorship-platfrom-backend.vercel.app/api/Connections/${user_id}`); // Adjust the endpoint
        const data = await response.json();
        console.log(data);

        // Create cards for each connection
        const cards = data.map(user => `
          <div class="card">
            <h3>${user.sender_name}</h3>
            <p>Status: ${user.status}</p>
            <button onclick="updateRequest(${user.id}, 'accepted')">Accept</button>
            <button onclick="updateRequest(${user.id}, 'declined')">Decline</button>
          </div>
        `);

        // Insert cards into the container
        connectionsList.innerHTML = cards.join("");
      } catch (error) {
        console.error("Error fetching connections:", error);
        connectionsList.innerHTML = "<p>Failed to load connections. Please try again later.</p>";
      }
    });
  </script>
  <script>
    async function updateRequest(requestId, status) {
      try {
        const response = await fetch(`https://mentorship-platfrom-backend.vercel.app/api/UpdateConnectionRequest`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ connection_id:requestId,status: status })
        });
        console.log(response)
        alert(`Request ${status}`);
        location.reload(); // Refresh page to show updated status
      } catch (error) {
        console.error(`Error updating request to ${status}:`, error);
      }
    }
  </script>
</body>

</html>
