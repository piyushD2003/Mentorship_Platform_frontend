<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar and Footer</title>

  <style>
    /* Footer Styles */
    .footer {
      border: 5px solid orange;
      border-radius: 25px;
      background-color: white;
      margin: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .footer p {
      margin: 0;
      color: #333;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <!-- Main Content -->
  <main>
    <p style="text-align: center; margin-top: 100px;">Welcome to the Mentorship Platform!</p>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2024 Mentorship Platform. All rights reserved.</p>
  </footer>

</body>

</html>
